<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kalkal — Calendar Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Mono:wght@400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-grain"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">&#x262A;</span>
        <div class="brand-text">
          <h1 class="site-title" id="app-title">Calendar Converter</h1>
          <p class="site-subtitle" id="app-subtitle">Gregorian / Julian / Hijri</p>
        </div>
      </div>
      <nav class="lang-switcher" id="lang-switcher" aria-label="Language">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="pl">PL</button>
        <button class="lang-btn" data-lang="ar">AR</button>
        <button class="lang-btn" data-lang="eo">EO</button>
      </nav>
    </div>
  </header>

  <main class="main-content">

    <div class="ai-bar" id="ai-bar" hidden>
      <form class="ai-form" id="ai-form" autocomplete="off">
        <div class="ai-input-wrap">
          <span class="ai-icon">&#10024;</span>
          <input type="text" id="ai-input" class="ai-input" data-i18n-placeholder="aiPlaceholder" placeholder="e.g. Battle of Hattin, 15 Ramadan 1445, death of Harun al-Rashid...">
          <button type="submit" class="ai-send" id="ai-send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
        <div class="ai-status" id="ai-status"></div>
      </form>
      <div class="ai-result" id="ai-result"></div>
    </div>

    <div class="converter-card">

      <form id="converter-form" class="converter-form" autocomplete="off">

        <div class="form-source">
          <div class="form-row form-row--primary">
            <div class="form-field form-field--cal">
              <label for="from-calendar" class="form-label" data-i18n="fromCalendar">From</label>
              <input type="text" id="from-calendar" class="input-cal" autocomplete="off">
            </div>
            <div class="form-field form-field--num">
              <label for="from-year" class="form-label" data-i18n="year">Year</label>
              <input type="number" id="from-year" min="1" dir="ltr" class="input-num" required>
            </div>
            <div class="form-field form-field--month">
              <label for="from-month" class="form-label" data-i18n="month">Month</label>
              <select id="from-month" class="input-month">
                <option value=""></option>
              </select>
            </div>
            <div class="form-field form-field--num">
              <label for="from-day" class="form-label" data-i18n="day">Day</label>
              <input type="number" id="from-day" min="1" max="31" dir="ltr" class="input-num">
            </div>
          </div>

          <div class="form-row form-row--range">
            <span class="range-marker">&hellip;</span>
            <div class="form-field form-field--num">
              <label for="to-year" class="form-label" data-i18n="year">Year</label>
              <input type="number" id="to-year" min="1" dir="ltr" class="input-num">
            </div>
            <div class="form-field form-field--month">
              <label for="to-month" class="form-label" data-i18n="month">Month</label>
              <select id="to-month" class="input-month">
                <option value=""></option>
              </select>
            </div>
            <div class="form-field form-field--num">
              <label for="to-day" class="form-label" data-i18n="day">Day</label>
              <input type="number" id="to-day" min="1" max="31" dir="ltr" class="input-num">
            </div>
          </div>
        </div>

        <div class="form-flow">
          <svg class="flow-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></svg>
        </div>

        <div class="form-error" id="form-error" role="alert"></div>

        <div class="form-row form-row--target">
          <div class="form-field form-field--cal">
            <label for="to-calendar" class="form-label" data-i18n="targetCalendar">Convert to</label>
            <input type="text" id="to-calendar" class="input-cal" autocomplete="off">
          </div>
          <div class="form-field form-field--action">
            <button type="submit" class="btn-convert" id="btn-convert">
              <span data-i18n="convert">Convert</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </div>
        </div>

      </form>

      <div class="divider">
        <span class="divider-ornament">&#10022;</span>
      </div>

      <section class="result-panel" id="result-panel" aria-live="polite">
        <p class="result-placeholder" id="result-placeholder">
          <span class="result-placeholder-icon">&#9788;</span>
        </p>
      </section>

    </div>

    <footer class="site-footer">
      <p class="footer-note" id="calendar-note" data-i18n="calendarNote">Dates before Oct 15, 1582 use the Julian calendar.</p>
      <p class="footer-note" id="tabular-note" data-i18n="tabularNote">Tabular Islamic calendar (arithmetic). May differ &plusmn;1&ndash;2 days from observation-based calendars.</p>
    </footer>

  </main>

  <script src="js/hijri.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
