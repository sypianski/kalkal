  <main class="main-content">

    <div class="ai-bar" id="ai-bar" hidden>
      <form class="ai-form" id="ai-form" autocomplete="off">
        <div class="ai-input-wrap">
          <span class="ai-icon">&#10024;</span>
          <input type="text" id="ai-input" class="ai-input" data-i18n-placeholder="aiPlaceholder" placeholder="e.g. Battle of Hattin, 15 Ramadan 1445, death of Harun al-Rashid...">
          <button type="submit" class="ai-send" id="ai-send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
        <div class="ai-status" id="ai-status"></div>
      </form>
      <div class="ai-result" id="ai-result"></div>
    </div>

    <div class="converter-grid">

      <div class="converter-left">

        <div class="converter-card">
          <form id="converter-form" class="converter-form" autocomplete="off">

            <div class="form-field form-field--cal">
              <label for="from-calendar" class="form-label" data-i18n="fromCalendar">From</label>
              <input type="text" id="from-calendar" class="input-cal" autocomplete="off" inputmode="none">
              <div class="variant-bar" id="from-variants"></div>
            </div>

            <div class="form-field form-field--num form-field--year">
              <label for="from-year" class="form-label" data-i18n="year">Year</label>
              <input type="number" id="from-year" min="1" dir="ltr" class="input-num" required>
            </div>

            <div class="form-error" id="form-error" role="alert"></div>

            <div class="form-field form-field--action">
              <button type="submit" class="btn-convert" id="btn-convert">
                <span data-i18n="convert">Convert</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </div>

          </form>
        </div>

        <div class="refine-card" id="refine-card" hidden>
          <div class="refine-field">
            <input type="text" id="from-month" class="refine-input" autocomplete="off" readonly>
            <label for="from-month" class="refine-label" data-i18n="month">Month</label>
          </div>
          <div class="refine-field">
            <input type="number" id="from-day" min="1" max="31" dir="ltr" class="refine-input">
            <label for="from-day" class="refine-label" data-i18n="day">Day</label>

        </div>

  <script src="js/app.js?v=16"></script>
  <script src="js/ai.js?v=13"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  // Custom install prompt
  (() => {
    let deferredPrompt;
    const banner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('install-btn');
    const btnDismiss = document.getElementById('install-dismiss');

    // Already installed or dismissed this session
    if (window.matchMedia('(display-mode: standalone)').matches) return;
    if (navigator.standalone) return; // iOS standalone
    if (sessionStorage.getItem('kalkal-install-dismissed')) return;

    // Detect iOS Safari (no beforeinstallprompt support)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|FxiOS/.test(navigator.userAgent);

    if (isIOS && isSafari) {
      const textEl = banner.querySelector('.install-text');
      textEl.textContent = '';
      textEl.append('Install kalkal: tap ');
      const shareIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      shareIcon.setAttribute('class', 'ios-share-icon');
      shareIcon.setAttribute('width', '18');
      shareIcon.setAttribute('height', '18');
      shareIcon.setAttribute('viewBox', '0 0 24 24');
      shareIcon.setAttribute('fill', 'none');
      shareIcon.setAttribute('stroke', 'currentColor');
      shareIcon.setAttribute('stroke-width', '2');
      shareIcon.setAttribute('stroke-linecap', 'round');
      shareIcon.setAttribute('stroke-linejoin', 'round');
      const path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path1.setAttribute('d', 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8');
      const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      polyline.setAttribute('points', '16 6 12 2 8 6');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', '12'); line.setAttribute('y1', '2');
      line.setAttribute('x2', '12'); line.setAttribute('y2', '15');
      shareIcon.append(path1, polyline, line);
      textEl.append(' ', shareIcon, ' then ');
      const strong = document.createElement('strong');
      strong.textContent = 'Add to Home Screen';
      textEl.append(strong);
      btnInstall.hidden = true;
      banner.hidden = false;
      return;
    }

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      banner.hidden = false;
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.hidden = true;
      if (outcome === 'accepted') {
        sessionStorage.setItem('kalkal-install-dismissed', '1');
      }
    });

    btnDismiss.addEventListener('click', () => {
      banner.hidden = true;
      sessionStorage.setItem('kalkal-install-dismissed', '1');
    });

    window.addEventListener('appinstalled', () => {
      banner.hidden = true;
    });
  })();
  </script>
